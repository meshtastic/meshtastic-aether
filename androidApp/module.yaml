product: android/app

apply:
  - //common.module-template.yaml

dependencies:
  - //shared
  - $libs.androidx.activity.compose
  - $libs.androidx.xr.scenecore
  - $libs.androidx.xr.runtime
  - $libs.androidx.xr.arcore
  - $libs.android.extensions.xr: compile-only

settings:
  compose: enabled
  android:
    applicationId: org.meshtastic.aether
    versionCode: 1 # CI stamps the commit count (scripts/stamp-build.sh)
    versionName: 0.1.0
    namespace: org.meshtastic.aether
    minSdk: 26 # meshtastic-sdk's floor
