product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, wasmJs]

apply:
  - //common.module-template.yaml
  - //detekt.module-template.yaml

plugins:
  build-info: enabled

aliases:
  - ble: [jvm, android, iosArm64, iosSimulatorArm64]
  - updatable: [jvm, android]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $libs.compose.material3
  - $libs.compose.navigationevent
  - $libs.navigation3.ui
  - $libs.compose.adaptive.navigation3
  - $compose.ui
  - $libs.kotlinx.coroutines.core
  - $libs.meshtastic.sdk.core
  - $libs.meshtastic.sdk.transport.websocket

test-dependencies:
  - $libs.kotlinx.coroutines.test

test-dependencies@jvm:
  - $compose.uiTest
  - $compose.desktop.currentOs

dependencies@jvm:
  - $libs.meshtastic.sdk.transport.tcp
  - $libs.meshtastic.sdk.transport.serial
  - $libs.meshtastic.sdk.transport.ble

dependencies@android:
  - $libs.meshtastic.sdk.transport.tcp
  - $libs.meshtastic.sdk.transport.serial
  - $libs.meshtastic.sdk.transport.ble

dependencies@ios:
  - $libs.meshtastic.sdk.transport.tcp
  - $libs.meshtastic.sdk.transport.ble

dependencies@wasmJs:
  - $libs.meshtastic.sdk.transport.ble

settings:
  android:
    minSdk: 26 # meshtastic-sdk's floor
  compose:
    enabled: true
