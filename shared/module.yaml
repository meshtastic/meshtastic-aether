product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, wasmJs]

apply:
  - //common.module-template.yaml

aliases:
  - ble: [jvm, android, iosArm64, iosSimulatorArm64]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $libs.compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.coroutines.core
  - $libs.meshtastic.sdk.core
  - $libs.meshtastic.sdk.transport.websocket

test-dependencies:
  - $libs.kotlinx.coroutines.test

dependencies@jvm:
  - $libs.meshtastic.sdk.transport.tcp
  - $libs.meshtastic.sdk.transport.serial
  - $libs.meshtastic.sdk.transport.ble

dependencies@android:
  - $compose.uiTooling
  - $libs.meshtastic.sdk.transport.tcp
  - $libs.meshtastic.sdk.transport.serial
  - $libs.meshtastic.sdk.transport.ble

dependencies@ios:
  - $libs.meshtastic.sdk.transport.tcp
  - $libs.meshtastic.sdk.transport.ble

settings:
  android:
    minSdk: 26 # meshtastic-sdk's floor
  compose:
    enabled: true
    resources:
      packageName: org.meshtastic.ambient.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
