name: Release

# Cut a release on main with `scripts/changelog.sh cut X.Y.Z` and `scripts/version.sh set X.Y.Z`, merge it, then
# dispatch this workflow with the version or push the vX.Y.Z tag. Every check runs before anything is tagged, so a
# refused release leaves no tag behind. Off while the repository is private, like CI. Process: RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (needs a CHANGELOG.md section and matching manifests)'
        required: true
        type: string
      dry_run:
        description: 'Run every check and build every artifact, but tag and release nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  prepare:
    name: Check the version, manifests and changelog
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED#v}"
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a version: $REQUESTED (want X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The commit is on main
        if: ${{ !inputs.dry_run }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; release from main or use a dry run"
            exit 1
          fi

      - name: Any existing tag points at this commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if tagged=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}"); then
            if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
              echo "::error::v$VERSION already tags $tagged, not this commit"
              exit 1
            fi
          fi

      - name: Every manifest carries the version
        run: scripts/version.sh check "${{ steps.version.outputs.version }}"

      - name: The changelog has the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/changelog.sh notes "$VERSION" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::the [$VERSION] section of CHANGELOG.md is empty"
            exit 1
          fi

      - name: Keep the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: [prepare, ci]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      label: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    name: Tag and publish the GitHub Release
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Tag the release
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Aether $VERSION"
            git push origin "v$VERSION"
          fi

      - name: Publish the release
        run: |
          gh release create "v$VERSION" --verify-tag --title "Aether $VERSION" \
            --notes-file artifacts/release-notes/release-notes.md \
            artifacts/android/* artifacts/desktop-*/* artifacts/web/*
