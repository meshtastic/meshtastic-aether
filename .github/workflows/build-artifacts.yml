name: Build artifacts

# The release and snapshot builds share these jobs: the Android APK and AAB (signed when the keystore secrets exist),
# the desktop installers (a deb on Linux, a dmg on macOS, an msi on Windows) with the executable jar the desktop updater
# swaps in on Linux and macOS, and the zipped web build, each uploaded as a workflow artifact. The build writes the
# label, build code and update channel into BuildInfo from the AETHER_BUILD_* variables (plugins/build-info); the
# Android job also stamps its manifest version (scripts/stamp-build.sh).
on:
  workflow_call:
    inputs:
      code:
        description: 'The build code, the commit count of the built commit; the Android versionCode'
        required: true
        type: string
      channel:
        description: 'What the build follows for updates: release, snapshot or dev'
        required: true
        type: string
      label:
        description: 'The version written into the file names, e.g. 0.1.0 or 0.1.0-SNAPSHOT-abc1234'
        required: true
        type: string
      ref:
        description: 'The commit to build; the calling commit when empty'
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1
  AETHER_BUILD_LABEL: ${{ inputs.label }}
  AETHER_BUILD_CODE: ${{ inputs.code }}
  AETHER_BUILD_CHANNEL: ${{ inputs.channel }}

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.label }}
      CODE: ${{ inputs.code }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Point the toolchain caches at one directory
        run: |
          echo "KOTLIN_CLI_BOOTSTRAP_CACHE_DIR=$HOME/kotlin-cache/cli" >> "$GITHUB_ENV"
          echo "KOTLIN_SHARED_CACHE_DIR=$HOME/kotlin-cache/shared" >> "$GITHUB_ENV"

      - name: Cache the Kotlin Toolchain and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kotlin-cache
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'common.module-template.yaml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # After the cache step: its key hashes module.yaml, which the stamp changes on every commit.
      - name: Stamp the Android version name and code
        run: scripts/stamp-build.sh "$VERSION" "$CODE"

      - name: Build the release APK and AAB
        run: |
          ./kotlin build -m androidApp -p android -v release
          ./kotlin package -m androidApp -p android -v release -f aab

      # Signed with the release keystore when its secrets exist; otherwise the files ship unsigned and say so.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          apk=build/tasks/_androidApp_buildAndroidRelease/gradle-project-release-unsigned.apk
          aab=build/tasks/_androidApp_bundleAndroid/gradle-project-release.aab
          tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          if [ "$HAS_KEYSTORE" = true ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "out/aether-$VERSION-android.apk" "$RUNNER_TEMP/aligned.apk"
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
              -signedjar "out/aether-$VERSION-android.aab" "$aab" "$KEY_ALIAS"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APK and AAB are unsigned"
            "$tools/zipalign" -f -p 4 "$apk" "out/aether-$VERSION-android-unsigned.apk"
            cp "$aab" "out/aether-$VERSION-android-unsigned.aab"
          fi
          badging=$("$tools/aapt2" dump badging out/*.apk)
          if ! grep -q "versionCode='$CODE' versionName='$VERSION'" <<<"$badging"; then
            echo "::error::the APK does not carry versionCode $CODE and versionName $VERSION"
            exit 1
          fi

      - name: Keep the Android files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/

  desktop:
    name: Desktop (${{ matrix.id }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            id: linux-x64
            jar: true
          - os: macos-latest
            id: macos-arm64
            jar: true
          - os: windows-latest
            id: windows-x64
            jar: false
    runs-on: ${{ matrix.os }}
    # Windows defaults to PowerShell, which the Bash steps below do not run under.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.label }}
      CODE: ${{ inputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Point the toolchain caches at one directory
        run: |
          echo "KOTLIN_CLI_BOOTSTRAP_CACHE_DIR=$HOME/kotlin-cache/cli" >> "$GITHUB_ENV"
          echo "KOTLIN_SHARED_CACHE_DIR=$HOME/kotlin-cache/shared" >> "$GITHUB_ENV"

      - name: Cache the Kotlin Toolchain and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kotlin-cache
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'common.module-template.yaml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      # The jar bundles the Compose native libraries for the OS it is built on, so each OS gets its own.
      - name: Package the executable jar
        run: |
          ./kotlin package -m desktopApp -f executable-jar
          mkdir -p out
          jar=build/tasks/_desktopApp_executableJarJvm/desktopApp-jvm-executable.jar
          if [ "${{ matrix.jar }}" = true ]; then cp "$jar" "out/aether-$VERSION-desktop-${{ matrix.id }}.jar"; fi
          echo "JAR=$jar" >> "$GITHUB_ENV"

      # Wraps that jar and a jlinked JetBrains Runtime, which the step above made the Toolchain download.
      - name: Package the installer
        run: scripts/package-desktop.sh "$VERSION" "${{ matrix.id }}" "$JAR" out

      - name: Keep the desktop files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.id }}
          path: out/

  web:
    name: Web build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.label }}
      CODE: ${{ inputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Point the toolchain caches at one directory
        run: |
          echo "KOTLIN_CLI_BOOTSTRAP_CACHE_DIR=$HOME/kotlin-cache/cli" >> "$GITHUB_ENV"
          echo "KOTLIN_SHARED_CACHE_DIR=$HOME/kotlin-cache/shared" >> "$GITHUB_ENV"

      - name: Cache the Kotlin Toolchain and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/kotlin-cache
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', 'common.module-template.yaml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Build the static site
        run: ./kotlin build -m webApp -v release

      # The Toolchain does not run Binaryen, which cuts the app's wasm module from 17 MB to 8.3 MB. skiko.wasm is the
      # library's own build and is shipped as is.
      - name: Optimize the wasm module
        env:
          BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl -fsSL "$BINARYEN_URL" -o "$RUNNER_TEMP/binaryen.tar.gz"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          site=build/tasks/_webApp_buildWasmJsAppWasmJsRelease
          before=$(stat -c%s "$site/webApp.wasm")
          # -all would enable the proposals this Binaryen knows and Chrome does not yet read (custom descriptors
          # and compact imports fail to compile there), so the newer ones stay off.
          newer=(--disable-custom-descriptors --disable-compact-imports --disable-custom-page-sizes
            --disable-acquire-release-atomics --disable-relaxed-atomics --disable-shared-everything
            --disable-stack-switching --disable-wide-arithmetic --disable-multimemory --disable-strings
            --disable-call-indirect-overlong)
          "$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" -all "${newer[@]}" --closed-world --traps-never-happen -O3 \
            "$site/webApp.wasm" -o "$RUNNER_TEMP/webApp.opt.wasm"
          mv "$RUNNER_TEMP/webApp.opt.wasm" "$site/webApp.wasm"
          echo "webApp.wasm: $before -> $(stat -c%s "$site/webApp.wasm") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Zip the static site
        run: |
          mkdir -p out
          (cd build/tasks/_webApp_buildWasmJsAppWasmJsRelease && zip -qr "$GITHUB_WORKSPACE/out/aether-$VERSION-web.zip" .)

      - name: Keep the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: out/
