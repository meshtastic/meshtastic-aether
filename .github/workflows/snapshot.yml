name: Snapshot

# After CI passes on a push to main, build that commit and replace the rolling `snapshot` prerelease with its files.
# Off while the repository is private: CI skips there, so nothing ever passes to trigger this.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  prepare:
    name: Pick the commit and name the snapshot
    if: >-
      ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.name.outputs.sha }}
      version: ${{ steps.name.outputs.version }}
      label: ${{ steps.name.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Name the snapshot
        id: name
        run: |
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^    versionName: *//p' androidApp/module.yaml | head -1)
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "label=$version-SNAPSHOT-${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      label: ${{ needs.prepare.outputs.label }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  publish:
    name: Replace the snapshot prerelease
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      LABEL: ${{ needs.prepare.outputs.label }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Collect the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Write the notes
        run: |
          {
            echo "An unreleased build of \`main\` at $SHA, replaced by every push that passes CI. Use a [release](https://github.com/${{ github.repository }}/releases/latest) for anything that matters."
            echo
            scripts/changelog.sh preview
          } > snapshot-notes.md

      - name: Replace the prerelease
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot --prerelease --target "$SHA" --title "Snapshot $LABEL" \
            --notes-file snapshot-notes.md \
            artifacts/android/* artifacts/desktop-*/* artifacts/web/*
