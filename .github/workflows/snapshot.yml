name: Snapshot

# After CI passes on a push to main, build that commit and move the rolling `snapshot` prerelease to it. The release
# is updated in place, with update.properties uploaded after every file it names, so the app's update check never
# meets a missing manifest or a manifest naming a file not yet there.
# Skipped in a private repository, like CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  prepare:
    name: Pick the commit and name the snapshot
    if: >-
      ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.name.outputs.sha }}
      code: ${{ steps.name.outputs.code }}
      label: ${{ steps.name.outputs.label }}
      newer: ${{ steps.newer.outputs.newer }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # The build code is the commit count, so a commit off main could outnumber every later snapshot.
      - name: The commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::snapshots build commits on main only"
            exit 1
          fi

      - name: Name the snapshot
        id: name
        run: |
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^    versionName: *//p' androidApp/module.yaml | head -1)
          {
            echo "sha=$sha"
            echo "code=$(git rev-list --count HEAD)"
            echo "label=$version-SNAPSHOT-${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      # A re-run or a slow run for an older commit must not replace a newer snapshot; a dispatch may rebuild the same one.
      - name: Newer than the published snapshot
        id: newer
        env:
          CODE: ${{ steps.name.outputs.code }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          published=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/snapshot/update.properties" | sed -n 's/^code=//p' || true)
          if [ -n "$published" ] && { [ "$published" -gt "$CODE" ] || { [ "$published" -eq "$CODE" ] && [ "$DISPATCH" != true ]; }; }; then
            echo "::notice::the published snapshot is build $published; this is build $CODE, so nothing is published"
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: prepare
    if: ${{ needs.prepare.outputs.newer == 'true' }}
    uses: ./.github/workflows/build-artifacts.yml
    with:
      code: ${{ needs.prepare.outputs.code }}
      channel: snapshot
      label: ${{ needs.prepare.outputs.label }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  publish:
    name: Move the snapshot prerelease
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      LABEL: ${{ needs.prepare.outputs.label }}
      CODE: ${{ needs.prepare.outputs.code }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Collect the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Write the notes
        run: |
          {
            echo "An unreleased build of \`main\` at $SHA, replaced by every push that passes CI. Use a [release](https://github.com/${{ github.repository }}/releases/latest) for anything that matters."
            echo
            scripts/changelog.sh preview
          } > snapshot-notes.md

      - name: Write the update manifest
        run: scripts/update-manifest.sh "$LABEL" "$CODE" snapshot artifacts/android/* artifacts/desktop-*/* > update.properties

      - name: Move the prerelease
        run: |
          files=(artifacts/android/* artifacts/desktop-*/* artifacts/web/*)
          if gh release view snapshot >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/snapshot" -f sha="$SHA" -F force=true >/dev/null
            gh release edit snapshot --prerelease --title "Snapshot $LABEL" --notes-file snapshot-notes.md
          else
            gh release create snapshot --prerelease --target "$SHA" --title "Snapshot $LABEL" --notes-file snapshot-notes.md
          fi
          gh release upload snapshot --clobber "${files[@]}"
          gh release upload snapshot --clobber update.properties
          # Then drop the previous build's files, which no manifest names any more.
          keep=$(printf '%s\n' update.properties "${files[@]##*/}")
          gh release view snapshot --json assets -q '.assets[].name' | while read -r name; do
            grep -qxF "$name" <<<"$keep" || gh release delete-asset snapshot "$name" --yes </dev/null
          done

  # The web build above is the site: deployed as built, never rebuilt.
  deploy-web:
    name: Deploy aether-snapshot.meshtastic.org
    needs: [prepare, build]
    # A failed desktop or Android job must not hold the site back: the web artifact exists once its own job passed.
    if: ${{ !cancelled() && needs.prepare.outputs.newer == 'true' && contains(fromJSON('["success","failure"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment holds the Vercel token and ids, and admits only main.
    environment:
      name: web-snapshot
      url: https://aether-snapshot.meshtastic.org
    steps:
      - name: Checkout the deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/vercel-deploy

      - name: Collect the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web

      - name: Unpack the web build
        run: unzip -q web/aether-*-web.zip -d web/dist

      - name: Deploy to aether-snapshot.meshtastic.org
        uses: ./.github/actions/vercel-deploy
        with:
          dist: web/dist
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ vars.VERCEL_ORG_ID }}
          vercel_project_id: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Check the site serves the new build
        run: |
          curl -fsSI https://aether-snapshot.meshtastic.org/webApp.wasm | head -1
          curl -fsS https://aether-snapshot.meshtastic.org/ | grep -q webApp.mjs
