name: Bug report
description: Something isn't working as documented.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in as much of the form as you can.
        For security issues, do not file here: see [`SECURITY.md`](../../SECURITY.md).

  - type: input
    id: app-version
    attributes:
      label: App version
      description: A release version or a commit SHA
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Desktop (JVM)
        - Android
        - iOS
        - Web
    validations:
      required: true

  - type: dropdown
    id: link
    attributes:
      label: Link type
      multiple: true
      options:
        - TCP
        - Bluetooth
        - WebSocket
        - Demo
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Node firmware version
      description: From the node's About screen in a Meshtastic client. Leave blank for the demo.
      placeholder: "2.5.10.abcdef"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The command or the steps on the connect screen. Smaller is better.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the relevant lines of the log (see the Logs section of the README for its location).
        Redact node names and positions you don't want public.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Affirmations
      options:
        - label: I have searched existing issues and this isn't a duplicate.
          required: true
        - label: I have read [`SECURITY.md`](../../SECURITY.md) and confirmed this is not a security-sensitive issue.
          required: true
